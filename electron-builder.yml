appId: com.cncsimulator.app
productName: CNC Simulator
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: configs
    to: configs
  - from: examples
    to: examples
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Installer languages follow the app: Portuguese (Brazil), English, Spanish
  installerLanguages: [pt_BR, en_US, es_ES]
  multiLanguageInstaller: true
# Phase 6: open programs by double-clicking them
# fileAssociations:
#   - ext: [nc, tap, ngc, cnc, min]
#     name: CNC Program
#     role: Viewer
# No icon yet: electron-builder uses the default Electron icon until build/icon.png (1024x1024) exists
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: Ismael Figueiredo <maelio@live.com>
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Unsigned: on first launch macOS asks to allow the app (right-click > Open)
  identity: null
